name: Deploy GEO-TYPE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore artwork from repository chunks
        shell: bash
        run: |
          cat public-chunks/geotype-ensemble.part*.bin > public/geotype-ensemble.png
          cat public-chunks/geotype-portraits.part*.bin > public/geotype-portraits.png
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:github
        env:
          VITE_SUPABASE_URL: https://twxdkztihnwjvcbtycyh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZOu8LcSVM6hdX8POlnr4zQ_fIF4V8vb
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
